ple-system, system-ui, &quot;Segoe UI&quot;, Roboto, &quot;Inter Variable&quot;, Inter, sans-serif" font-size="15" font-weight="650" fill="rgb(83, 160, 255)">CSSInjector</text><text x="338" y="152" font-family="ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Roboto, &quot;Inter Variable&quot;, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#c4c4c4">Writes one generated</text><text x="338" y="170" font-family="ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Roboto, &quot;Inter Variable&quot;, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#c4c4c4">stylesheet from it.</text><rect x="324" y="244" width="236" height="84" rx="4" fill="rgba(8, 185, 78, 0.1)"/><g transform="translate(338 257) scale(0.75)" fill="none" stroke="rgb(52, 199, 110)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><path d="M8 21h8"/><path d="M12 17v4"/></g><text x="364" y="271" font-family="ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Roboto, &quot;Inter Variable&quot;, Inter, sans-serif" font-size="15" font-weight="650" fill="rgb(52, 199, 110)">Obsidian</text><text x="338" y="296" font-family="ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Roboto, &quot;Inter Variable&quot;, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#c4c4c4">Repaints every open note,</text><text x="338" y="314" font-family="ui-sans-serif, -apple-system, system-ui, &quot;Segoe UI&quot;, Roboto, &quot;Inter Variable&quot;, Inter, sans-serif" font-size="13.5" font-weight="400" fill="#c4c4c4">with no reload.</text><rect x="40" y="244" width="236" height="84" rx="4" fill="rgba(236, 117, 0, 0.1)"/><g transform="translate(54 257) scale(0.75)" fill="none" stroke="rgb(245, 150, 60)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 