name: Build and deploy

# Builds the site and publishes it on GitHub Pages. The pages come from the
# Callout-Studio/obsidian commit in source-commit.txt, the look and the build
# from the Callout-Studio/docs-theme commit in theme-commit.txt; each of those
# repositories rewrites its file here when it changes, and that push is what
# runs this. The steps themselves are docs-theme's build-site.yml.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit:
        description: "Callout-Studio/obsidian commit to build: empty for the one in source-commit.txt, or master for the newest"
        required: false
        default: ""
      theme:
        description: "Callout-Studio/docs-theme commit to build with: empty for the one in theme-commit.txt, or main for the newest"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  site:
    uses: Callout-Studio/docs-theme/.github/workflows/build-site.yml@main
    with:
      commit: ${{ inputs.commit }}
      theme: ${{ inputs.theme }}
